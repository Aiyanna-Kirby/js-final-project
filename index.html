<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anime Paradise</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./index.js"></script>
    <script
      src="https://kit.fontawesome.com/c0bfdcb673.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <div class="dark-overlay"></div>
      <nav>
        <div class="container nav__container">
          <img
            src="./assets/Beige Feminine and Beauty Fashion Boutique Logo (Banner (Landscape)).png"
            class="nav__logo"
            alt=""
          />
          <ul class="nav__links">
            <a href="#landing" class="nav__link nav__link--hover">Home</a>
            <a href="#anime__selection" class="nav__link nav__link--hover"
              >Find Your Next Watch</a
            >
            <button class="nav__btn">Contact</button>
          </ul>
        </div>
      </nav>
      <section id="landing">
        <div class="container landing__container">
          <div class="row landing__row">
            <h1 class="search-bar__title">Browse an Endless Array of Anime</h1>
            <form class="search__form">
              <input
                type="search"
                placeholder="Browse Anime Here..."
                class="search__area"
              />
              <button class="search__btn btn">
                <i class="fa-solid fa-magnifying-glass"></i>
              </button>
            </form>
          </div>
        </div>
      </section>
    </header>
    <section id="anime__selection">
      <div class="container anime__selection--container">
        <div class="row anime__selection--row">
          <div class="interactives">
            <h2>Search Results:</h2>
            <div class="search__filter">
              <h4 class="search__filter--title">Search Filter:</h4>
              <select id="filter" onchange="filteranimeData(event)">
                <option value="" disabled selected>Sort</option>
                <option value="LOW_TO_HIGH">Length, Low to High</option>
                <option value="HIGH_TO_LOW">Length, High to Low</option>
                <option value="A_TO_Z">Title, A to Z</option>
                <option value="Z_TO_A">Title, Z to A</option>
              </select>
            </div>
          </div>
          <div class="anime__display anime-elements"></div>
        </div>
      </div>
    </section>
    <footer>
      <div class="container footer__container">
        <div class="row footer__row">
          <div class="footer__links">
            <a href="#landing" class="footer__link footer__link--hover">Home</a>
            <a href="#anime__selection" class="footer__link footer__link--hover"
              >Find Your Next Watch</a
            >
            <a href="#" class="footer__link footer__link--hover contact__link">Contact</a>
          </div>
          <p class="footer__copyright">&copy; 2026 Anime Paradise. All rights reserved.</p>
        </div>
      </div>
    </footer>
  </body>
</html>
