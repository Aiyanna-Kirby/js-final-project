<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anime API Display</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./index.js"></script>
    <script
      src="https://kit.fontawesome.com/c0bfdcb673.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <div class="dark-overlay"></div>
      <nav>
        <div class="container nav__container">
          <img
            src="./assets/Beige Feminine and Beauty Fashion Boutique Logo (Banner (Landscape)).png"
            class="nav__logo"
            alt=""
          />
          <ul class="nav__links">
            <a href="#" class="nav__link nav__link--hover">Home</a>
            <a href="#" class="nav__link nav__link--hover">Find Your Next Watch</a>
            <button class="nav__btn">Contact</button>
          </ul>
        </div>
      </nav>
      <section id="landing">
        <div class="container landing__container">
          <div class="row landing__row">
            <h1 class="search-bar__title">Browse an Endless Array of Anime</h1>
            <form class="search__form">
              <input
                type="search"
                placeholder="Browse Anime Here..."
                class="search__area"
              />
              <button class="search__btn btn">
                <i class="fa-solid fa-magnifying-glass"></i>
              </button>
            </form>
          </div>
        </div>
      </section>
    </header>
    <section id="anime__selection">
      <div class="container anime__selection--container">
        <div class="row anime__selection--row">
          <div class="interactives">
            <h2>Search Results:</h2>
            <h4>Search Filter: TBD</h4>
          </div>
          <div class="anime__display">
            <div class="display__card">
              <img src="" class="anime__cover" alt="" />
              <div class="show__details">
                <p><b>Title:</b> (insert here)</p>
                <p><b>Rating:</b> (insert here)</p>
                <p><b>Genre:</b> (insert here)</p>
                <p><b>Length:</b> (insert here)</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
