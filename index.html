<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anime API Display</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./index.js"></script>
    <script
      src="https://kit.fontawesome.com/c0bfdcb673.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
      <section id="nav">
        <nav>
          <div class="container nav__container">
            <img
              src="https://dev.d24jig8s1lr7n9.amplifyapp.com/img/whitelogo.39850b27.png"
              class="nav__logo"
              alt=""
            />
            <ul class="nav__links">
              <a href="#" class="nav__link">Home</a>
              <a href="#" class="nav__link">Find Your Car</a>
              <button class="nav__btn">Contact</button>
            </ul>
          </div>
        </nav>
      </section>
      <section id="landing">
        <div class="container landing__container">
          <div class="row landing__row">
            <h1 class="search-bar__title">Browse an Endless Array of Anime</h1>
            <form class="search__form">
              <input
                type="search"
                placeholder="Browse Anime Here..."
                class="search__area"
              />
              <button class="search__btn">
                <i class="fa-solid fa-magnifying-glass"></i>
              </button>
            </form>
          </div>
        </div>
      </section>
      </div>
  </body>
</html>
